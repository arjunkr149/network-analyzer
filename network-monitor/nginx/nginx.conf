events { worker_connections 1024; }

http {
  upstream backend  { server backend:4000; }
  upstream frontend { server frontend:80; }
  upstream kibana   { server kibana:5601; }
  upstream grafana  { server grafana:3000; }

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  server {
    listen 80;
    server_name _;

    # Redirect HTTP → HTTPS (uncomment when SSL is configured)
    # return 301 https://$host$request_uri;

    # ── Frontend React App ──
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Backend REST API ──
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── WebSocket (for live packet streaming) ──
    location /ws {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600;
      proxy_send_timeout 3600;
    }

    # ── Kibana ──
    location /kibana/ {
      proxy_pass http://kibana/;
      proxy_set_header Host $host;
    }

    # ── Grafana ──
    location /grafana/ {
      proxy_pass http://grafana/;
      proxy_set_header Host $host;
    }
  }

  # ── HTTPS (uncomment and add certs) ──────────────────────────────────────
  # server {
  #   listen 443 ssl;
  #   server_name yourdomain.com;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   ssl_ciphers HIGH:!aNULL:!MD5;
  #
  #   location / { proxy_pass http://frontend; }
  #   location /api/ { proxy_pass http://backend; }
  #   location /ws {
  #     proxy_pass http://backend;
  #     proxy_http_version 1.1;
  #     proxy_set_header Upgrade $http_upgrade;
  #     proxy_set_header Connection "Upgrade";
  #     proxy_read_timeout 3600;
  #   }
  # }
}
