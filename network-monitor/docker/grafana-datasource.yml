apiVersion: 1

datasources:
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "network-traffic-*"
    jsonData:
      esVersion: "8.0.0"
      timeField: "@timestamp"
      interval: Daily
    isDefault: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
