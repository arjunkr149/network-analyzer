name: Deploy Network Monitor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Test ────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: cd backend && npm install

      - name: Test backend starts
        run: |
          cd backend && node -e "
            const s = require('./server.js');
            setTimeout(() => { console.log('Backend OK'); process.exit(0); }, 2000);
          " || true

      - name: Install frontend deps
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          REACT_APP_API_URL: http://localhost:4000/api
          REACT_APP_WS_URL: ws://localhost:4000
          CI: false

  # ── Job 2: Docker Build & Push ─────────────────────────────────────────────
  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nm-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nm-frontend:latest
          build-args: |
            REACT_APP_API_URL=https://${{ secrets.SERVER_HOST }}/api
            REACT_APP_WS_URL=wss://${{ secrets.SERVER_HOST }}/ws

  # ── Job 3: Deploy to Server ────────────────────────────────────────────────
  deploy:
    name: Deploy to Ubuntu Server
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Pull latest code
            cd /opt/network-monitor
            git pull origin main

            # Pull new Docker images
            docker pull ${{ secrets.DOCKER_USERNAME }}/nm-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/nm-frontend:latest

            # Restart containers with zero downtime
            docker-compose pull
            docker-compose up -d --no-deps backend frontend nginx

            # Health check
            sleep 10
            curl -f http://localhost/api/health && echo "✅ Deploy successful!" || echo "❌ Health check failed"
